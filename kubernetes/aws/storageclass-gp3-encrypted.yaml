# Encrypted gp3 volumes for the database (EBS CSI driver add-on), with the
# customer-managed KMS key from infra/aws/db (output kms_key_arn).
# Cluster-scoped. Applied by deploy-kubernetes.sh --aws.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ${GAMIFICATIONENGINE_CNPG_STORAGE_CLASS}
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
  encrypted: "true"
  kmsKeyId: ${GAMIFICATIONENGINE_AWS_DB_KMS_KEY_ARN}
# EBS volumes live in one availability zone: create each volume where its
# pod is scheduled, so instances spread over zones get volumes in their zone.
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
# Keep the volume (and data) if a PVC is deleted by mistake; delete released
# volumes by hand.
reclaimPolicy: Retain
