# Copies the application database credentials from AWS Secrets Manager
# (infra/aws/db output db_app_secret_name, JSON {"username","password"})
# into the Kubernetes Secret the API and the CloudNativePG cluster read.
# A changed password reaches the cluster's role within refreshInterval; API
# pods use it after a restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${GAMIFICATIONENGINE_DB_CREDENTIALS_SECRET}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: ${GAMIFICATIONENGINE_DB_CREDENTIALS_SECRET}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # CloudNativePG applies a password change to the role right away.
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: ${GAMIFICATIONENGINE_AWS_DB_APP_SECRET}
        property: username
    - secretKey: password
      remoteRef:
        key: ${GAMIFICATIONENGINE_AWS_DB_APP_SECRET}
        property: password
