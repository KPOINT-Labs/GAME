# AWS Secrets Manager as a source for External Secrets, in this namespace
# only. Requires the External Secrets Operator (external-secrets.io/v1).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${GAMIFICATIONENGINE_AWS_REGION}
      auth:
        jwt:
          serviceAccountRef:
            name: ${GAMIFICATIONENGINE_AWS_SECRETS_SERVICE_ACCOUNT}
