# Identity External Secrets uses to read AWS Secrets Manager (IAM Roles for
# Service Accounts). The role (infra/aws/db output secrets_reader_role_arn)
# may only read this environment's database secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${GAMIFICATIONENGINE_AWS_SECRETS_SERVICE_ACCOUNT}
  annotations:
    eks.amazonaws.com/role-arn: ${GAMIFICATIONENGINE_AWS_SECRETS_ROLE_ARN}
