# Application database credentials, from .env. Read by the API (DB_USER,
# DB_PASSWORD) and by the CloudNativePG cluster (owner role and its
# password) or the single-instance Postgres.
#
# Applied by deploy-kubernetes.sh --cnpg / --postgres when
# GAMIFICATIONENGINE_DB_SECRETS_SOURCE=env. On AWS
# (GAMIFICATIONENGINE_DB_SECRETS_SOURCE=aws) External Secrets creates this
# Secret from AWS Secrets Manager instead (kubernetes/aws/).
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: ${GAMIFICATIONENGINE_DB_CREDENTIALS_SECRET}
  labels:
    # CloudNativePG applies a password change to the role right away.
    cnpg.io/reload: "true"
stringData:
  username: "${GAMIFICATIONENGINE_DB_USER}"
  password: "${GAMIFICATIONENGINE_DB_PASSWORD}"
