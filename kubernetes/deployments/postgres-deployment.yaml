apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml
    kompose.version: 1.32.0 (765fde254)
  labels:
    io.kompose.service: ${GAMIFICATIONENGINE_SERVICE_NAME_POSTGRES}
  name: ${GAMIFICATIONENGINE_SERVICE_NAME_POSTGRES}
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: ${GAMIFICATIONENGINE_SERVICE_NAME_POSTGRES}
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml
        kompose.version: 1.32.0 (765fde254)
      labels:
        io.kompose.network/game-backend: "true"
        io.kompose.service: ${GAMIFICATIONENGINE_SERVICE_NAME_POSTGRES}
    spec:
      containers:
        - resources:
            limits:
              memory: 2Gi
          env:
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
            - name: DB_ENGINE
              valueFrom:
                configMapKeyRef:
                  key: DB_ENGINE
                  name: env-prod
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  key: DB_HOST
                  name: env-prod
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  key: DB_NAME
                  name: env-prod
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: ${GAMIFICATIONENGINE_DB_CREDENTIALS_SECRET}
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  key: DB_PORT
                  name: env-prod
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: ${GAMIFICATIONENGINE_DB_CREDENTIALS_SECRET}
            - name: DEFAULT_CONVERTION_RATE_POINTS_TO_COIN
              valueFrom:
                configMapKeyRef:
                  key: DEFAULT_CONVERTION_RATE_POINTS_TO_COIN
                  name: env-prod
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  key: ENV
                  name: env-prod
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  key: DB_NAME
                  name: env-prod
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: ${GAMIFICATIONENGINE_DB_CREDENTIALS_SECRET}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: ${GAMIFICATIONENGINE_DB_CREDENTIALS_SECRET}
            - name: VERSION_APP
              valueFrom:
                configMapKeyRef:
                  key: VERSION_APP
                  name: env-prod
          # Pinned to the major version the existing volume was initialised
          # with (production runs PostgreSQL 18): an unpinned tag can pull a
          # new major version on restart, which cannot open the existing data
          # directory. Upgrade majors deliberately (pg_upgrade or
          # dump/restore), never by changing this tag alone. PGDATA (above)
          # keeps the data inside the mounted volume, which the 18+ images
          # require.
          image: postgres:18-alpine
          name: postgres
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Generous: crash recovery after an unclean stop can take a while,
          # and killing Postgres mid-recovery only makes it slower.
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
      hostname: db
      restartPolicy: Always
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
