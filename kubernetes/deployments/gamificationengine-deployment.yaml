apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml
    kompose.version: 1.32.0 (765fde254)
  labels:
    io.kompose.service: ${GAMIFICATIONENGINE_SERVICE_NAME}
  name: ${GAMIFICATIONENGINE_SERVICE_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: ${GAMIFICATIONENGINE_SERVICE_NAME}
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml
        kompose.version: 1.32.0 (765fde254)
      labels:
        io.kompose.network/game-backend: "true"
        io.kompose.service: ${GAMIFICATIONENGINE_SERVICE_NAME}
    spec:
      containers:
        - resources:
            limits:
              memory: 1Gi
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  key: DATABASE_URL
                  name: env-prod
            - name: DB_ENGINE
              valueFrom:
                configMapKeyRef:
                  key: DB_ENGINE
                  name: env-prod
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  key: DB_HOST
                  name: env-prod
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  key: DB_NAME
                  name: env-prod
            - name: DB_PASSWORD
              valueFrom:
                configMapKeyRef:
                  key: DB_PASSWORD
                  name: env-prod
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  key: DB_PORT
                  name: env-prod
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  key: DB_USER
                  name: env-prod
            - name: DEFAULT_CONVERTION_RATE_POINTS_TO_COIN
              valueFrom:
                configMapKeyRef:
                  key: DEFAULT_CONVERTION_RATE_POINTS_TO_COIN
                  name: env-prod
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  key: ENV
                  name: env-prod
            - name: VERSION_APP
              valueFrom:
                configMapKeyRef:
                  key: VERSION_APP
                  name: env-prod
          image: fvergaracl/game:v1.1.005
          name: game-api
          ports:
            - containerPort: 8000
          # Liveness never touches the database, so a database outage does
          # not restart API pods in a loop.
          livenessProbe:
            httpGet:
              path: /api/v1/kpi/health_check
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # TODO: switch readiness to /api/v1/kpi/ready (checks the database,
          # so pods that cannot reach it stop receiving traffic) when the
          # image tag above is bumped to a build that includes it (PR #16
          # onwards). The current image has no /ready, so it would 404 and no
          # pod would become ready; until then readiness uses the liveness
          # endpoint.
          readinessProbe:
            httpGet:
              path: /api/v1/kpi/health_check
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
