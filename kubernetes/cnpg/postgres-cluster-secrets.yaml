# Credentials for the CloudNativePG cluster (postgres-cluster.yaml).
# Rendered with envsubst by deploy-kubernetes.sh --cnpg.
#
# The cluster creates the application database owner with the API's
# GAMIFICATIONENGINE_DB_USER / GAMIFICATIONENGINE_DB_PASSWORD.
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: ${GAMIFICATIONENGINE_CNPG_CLUSTER_NAME}-app-owner
stringData:
  username: "${GAMIFICATIONENGINE_DB_USER}"
  password: "${GAMIFICATIONENGINE_DB_PASSWORD}"
