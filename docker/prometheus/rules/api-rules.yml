# HTTP API latency and error alerts, from the per-route metrics exposed by
# prometheus_fastapi_instrumentator (app/main.py, HTTP_LATENCY_BUCKETS).
# Shown on the "API Overview" Grafana dashboard. Mirrored for Kubernetes in
# kubernetes/configmaps/api-prometheus-rules.yaml; keep the two in sync.
#
# Every alert requires some traffic on the route (> 0.05 req/s over the
# window) so a single slow request on an otherwise idle route does not page.
groups:
  - name: game-api
    interval: 30s
    rules:
      - alert: ApiRouteLatencyP95High
        expr: |
          (
            histogram_quantile(
              0.95,
              sum by (le, handler) (
                rate(http_request_duration_seconds_bucket[5m])
              )
            ) > 1
          )
          and
          (
            sum by (handler) (rate(http_requests_total[5m])) > 0.05
          )
        for: 10m
        labels:
          severity: warning
          service: game
          component: api
        annotations:
          summary: >-
            p95 latency above 1s on {{ $labels.handler }}
          description: |
            The 95th percentile of http_request_duration_seconds for
            {{ $labels.handler }} has been above 1 second for 10 minutes
            (current value: {{ $value | humanizeDuration }}).
            Dashboard: Grafana > GAME > API Overview.

      - alert: ApiActivityLatencyP95High
        expr: |
          (
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{handler="/api/v1/games/{gameId}/users/{externalUserId}/activity"}[5m])
              )
            ) > 0.5
          )
          and
          (
            sum(rate(http_requests_total{handler="/api/v1/games/{gameId}/users/{externalUserId}/activity"}[5m])) > 0.05
          )
        for: 10m
        labels:
          severity: warning
          service: game
          component: api
          endpoint: activity
        annotations:
          summary: >-
            /activity p95 latency above 500ms
          description: |
            The 95th percentile of GET
            /games/{gameId}/users/{externalUserId}/activity has been above
            500 ms for 10 minutes (current value:
            {{ $value | humanizeDuration }}). Typical p95 is well under 250 ms;
            check worker count and database load before the query itself.
            Dashboard: Grafana > GAME > API Overview > User activity.

      - alert: ApiRoute5xxRateHigh
        expr: |
          (
            sum by (handler) (rate(http_requests_total{status="5xx"}[10m]))
            /
            sum by (handler) (rate(http_requests_total[10m]))
          ) > 0.05
          and
          (
            sum by (handler) (rate(http_requests_total[10m])) > 0.05
          )
        for: 10m
        labels:
          severity: critical
          service: game
          component: api
        annotations:
          summary: >-
            More than 5% of requests to {{ $labels.handler }} fail with 5xx
          description: |
            {{ $value | humanizePercentage }} of requests to
            {{ $labels.handler }} returned a 5xx status over the last 10
            minutes. Check the API logs and Sentry.
            Dashboard: Grafana > GAME > API Overview.

      - alert: RedisUnavailableFallbackActive
        expr: |
          sum by (component) (rate(redis_fallback_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
          service: game
          component: redis
        annotations:
          summary: >-
            Redis unavailable for {{ $labels.component }}; running on the fallback
          description: |
            {{ $labels.component }} has served requests without Redis for 10
            minutes (API key cache: per-process cache; rate limiting:
            database counters). Requests still succeed, but API key
            revocations take up to API_KEY_HEADER_CACHE_TTL_SECONDS to reach
            every worker and rate limiting adds database writes. Check Redis
            and the "Redis unavailable" warnings in the API logs.
